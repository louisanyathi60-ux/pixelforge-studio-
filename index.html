<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studio</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#0b0014;color:white;overflow-x:hidden;}

header{
position:fixed;top:0;width:100%;z-index:1000;
display:flex;justify-content:space-between;align-items:center;
padding:15px 20px;
background:rgba(0,0,0,0.4);
backdrop-filter:blur(10px);
}

.logo{font-weight:bold;color:#d8a4ff;text-shadow:0 0 10px #a855f7;}

nav{display:none;flex-direction:column;position:absolute;top:60px;right:20px;background:#140022;border-radius:10px;}
nav a{padding:10px 15px;text-decoration:none;color:white;}
nav a:hover{background:#2a0050;}

.hamburger{font-size:22px;cursor:pointer;}
.show{display:flex;}

.hero{
padding-top:100px;
display:flex;
flex-direction:column;
text-align:center;
padding:100px 20px 40px;
background:radial-gradient(circle at top,#2a0050,#0b0014);
}

.hero-text h1{
font-size:36px;
line-height:1.2;
}

.hero-text span{color:#d8a4ff;}

.hero-text p{
margin-top:15px;
opacity:0.8;
}

.btn{
display:inline-block;
margin-top:20px;
padding:12px 25px;
border-radius:25px;
background:linear-gradient(45deg,#a855f7,#d8a4ff);
text-decoration:none;
color:white;
}

.hero-image{
margin-top:30px;
}

.hero-image img{
width:100%;border-radius:20px;
box-shadow:0 0 40px rgba(168,85,247,0.6);
}

/* DESKTOP */
@media(min-width:768px){
nav{display:flex;position:static;flex-direction:row;background:none;}
.hamburger{display:none;}
.hero{
flex-direction:row;
text-align:left;
align-items:center;
justify-content:space-between;
padding:120px 80px;
}
.hero-text{max-width:500px;}
.hero-text h1{font-size:55px;}
.hero-image img{width:500px;}
}
</style></head><body><header>
<div class="logo">🚀 PIXELFORGE</div>
<div class="hamburger" onclick="toggleMenu()">☰</div>
<nav id="menu">
<a href="index.html">Home</a>
<a href="projects.html">Projects</a>
<a href="prices.html">Prices</a>
<a href="contact.html">Contact</a>
</nav>
</header><section class="hero"><div class="hero-text">
<h1>We design <span>high-end websites</span> that convert</h1>
<p>Elevate your brand with visually stunning websites built using Shopify, WordPress and custom code.</p>
<a href="projects.html" class="btn">View Projects</a>
</div><div class="hero-image">
<img src="https://images.unsplash.com/photo-1519389950473-47ba0277781c">
</div></section><script>
function toggleMenu(){
 document.getElementById('menu').classList.toggle('show');
}
</script></body>
</html>
