<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studio</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Segoe UI',sans-serif;
  background:#0d0b1f;
  color:white;
  overflow-x:hidden;
}

/* BACKGROUND GLOW */
body::before{
  content:'';
  position:fixed;
  width:700px;
  height:700px;
  background:#7b2cff;
  filter:blur(200px);
  top:-200px;
  left:-200px;
  opacity:0.5;
  z-index:-1;
}

/* NAVBAR */
.navbar{
  display:flex;
  justify-content:space-between;
  padding:20px;
  position:fixed;
  width:100%;
  backdrop-filter:blur(12px);
  z-index:1000;
}

.logo{font-size:22px;font-weight:bold;}

.menu-toggle{font-size:28px;cursor:pointer;}

.nav-links{
  position:fixed;
  top:0;
  right:-100%;
  width:100%;
  height:100%;
  background:#0d0b1f;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  transition:0.4s;
}

.nav-links.active{right:0;}

.nav-links a{
  font-size:26px;
  margin:15px;
  color:white;
  text-decoration:none;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

/* TITLE */
.hero h1{
  font-size:60px;
  letter-spacing:2px;
  background:linear-gradient(90deg,#ffffff,#c084ff,#7b2cff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* SUBTEXT */
.hero p{
  margin-top:10px;
  opacity:0.8;
}

/* LAPTOP MOCKUP */
.laptop{
  margin-top:40px;
  width:320px;
  height:200px;
  background:#1a163d;
  border-radius:10px;
  position:relative;
  box-shadow:0 0 40px rgba(123,44,255,0.5);
  animation:float 4s ease-in-out infinite;
}

/* SCREEN */
.screen{
  width:90%;
  height:75%;
  background:linear-gradient(135deg,#7b2cff,#1a163d);
  margin:15px auto;
  border-radius:5px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
}

/* BASE */
.base{
  width:120%;
  height:15px;
  background:#1a163d;
  position:absolute;
  bottom:-10px;
  left:-10%;
  border-radius:10px;
}

/* FLOAT ANIMATION */
@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-15px);}
  100%{transform:translateY(0);}
}

/* BUTTON */
.btn{
  margin-top:25px;
  padding:14px 30px;
  background:#7b2cff;
  border-radius:10px;
  text-decoration:none;
  color:white;
  box-shadow:0 0 20px #7b2cff;
  transition:0.3s;
}

.btn:hover{
  transform:scale(1.05);
}

/* SOCIALS */
.socials{
  margin-top:40px;
  display:flex;
  gap:20px;
}

.socials a{
  padding:12px;
  border-radius:50%;
  background:rgba(255,255,255,0.05);
  color:white;
}

.socials a:hover{
  background:#7b2cff;
  box-shadow:0 0 15px #7b2cff;
}

/* WHATSAPP */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  padding:15px;
  border-radius:50%;
  font-size:22px;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="logo">PixelForge</div>
  <div class="menu-toggle" id="menu-toggle">☰</div>
</nav>

<div class="nav-links" id="nav-links">
  <a href="#">Home</a>
  <a href="#">Pricing</a>
  <a href="#">Contact</a>
</div>

<!-- HERO -->
<section class="hero">

  <h1>PROFESSIONAL WEBSITES</h1>
  <p>Get a website that helps your business grow</p>

  <!-- FAKE LAPTOP -->
  <div class="laptop">
    <div class="screen">
      We Build Powerful Brands
    </div>
    <div class="base"></div>
  </div>

  <a href="#" class="btn">Get Started</a>

  <!-- SOCIALS -->
  <div class="socials">
    <a href="#"><i class="fab fa-facebook-f"></i></a>
    <a href="#"><i class="fab fa-instagram"></i></a>
    <a href="#"><i class="fab fa-whatsapp"></i></a>
  </div>

</section>

<a href="#" class="whatsapp"><i class="fab fa-whatsapp"></i></a>

<script>
document.getElementById('menu-toggle').onclick = () => {
  document.getElementById('nav-links').classList.toggle('active');
};
</script>

</body>
</html>
