<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{
  background:#0b0014;
  color:white;
  overflow-x:hidden;
}/* BACKGROUND */ .hero{ height:100vh; display:flex; align-items:center; justify-content:space-between; padding:60px; background:radial-gradient(circle at top left,#2a0050,#0b0014); }

/* NAV */ header{ position:absolute; top:0; width:100%; display:flex; justify-content:space-between; align-items:center; padding:20px 60px; }

.logo{ font-size:22px; font-weight:bold; color:#d8a4ff; text-shadow:0 0 15px #a855f7; }

nav a{ margin-left:30px; color:white; text-decoration:none; opacity:0.8; } nav a:hover{ opacity:1; text-shadow:0 0 10px #a855f7; }

.cta{ background:linear-gradient(45deg,#a855f7,#d8a4ff); padding:10px 20px; border-radius:20px; }

/* LEFT TEXT */ .hero-text{ max-width:500px; }

.hero-text h1{ font-size:55px; line-height:1.2; }

.hero-text span{ color:#d8a4ff; }

.hero-text p{ margin-top:20px; opacity:0.8; }

.btn{ margin-top:25px; display:inline-block; background:linear-gradient(45deg,#a855f7,#d8a4ff); padding:15px 30px; border-radius:30px; text-decoration:none; color:white; box-shadow:0 0 25px rgba(168,85,247,0.8); transition:0.3s; }

.btn:hover{ transform:scale(1.1); }

/* RIGHT MOCKUP */ .hero-image{ position:relative; }

.hero-image img{ width:500px; border-radius:20px; box-shadow:0 0 60px rgba(168,85,247,0.8); }

/* FLOATING CARD */ .floating{ position:absolute; top:-40px; left:-60px; background:rgba(255,255,255,0.05); padding:15px; border-radius:15px; backdrop-filter:blur(15px); box-shadow:0 0 20px rgba(168,85,247,0.4); }

/* ROCKET */ .rocket{ position:absolute; top:-60px; right:-40px; font-size:40px; color:#d8a4ff; text-shadow:0 0 20px #a855f7; }

</style>
</head>
