<!DOCTYPE html>
<html>
<head>
<title>Contact - PixelForge</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body{
  background:#070710;
  color:white;
  font-family:sans-serif;
  text-align:center;
}

.container{
  max-width:500px;
  margin:auto;
  padding:40px;
}

h1{margin-bottom:10px;}

p{color:#aaa;margin-bottom:20px;}

form{
  display:flex;
  flex-direction:column;
  gap:10px;
}

input, textarea, select{
  padding:12px;
  border:none;
  border-radius:8px;
}

button{
  padding:12px;
  border:none;
  border-radius:8px;
  background:#7b2cff;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* SOCIAL ICONS */
.socials{
  margin-top:25px;
  display:flex;
  justify-content:center;
  gap:20px;
}

.socials a{
  font-size:20px;
  color:white;
  padding:12px;
  border-radius:50%;
  background:#111122;
  transition:0.3s;
}

.socials a:hover{
  background:#7b2cff;
}

/* WHATSAPP BUTTON */
.whatsapp{
  margin-top:20px;
  display:inline-block;
  padding:12px 20px;
  background:#25D366;
  border-radius:8px;
  color:white;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<h1>Let’s Build Your Website 🚀</h1>
<p>Tell us what you need and we’ll get back to you.</p>

<form onsubmit="sendMsg(event)">
<input id="name" placeholder="Your Name" required>
<input id="email" type="email" placeholder="Your Email" required>

<select id="service">
  <option>Starter Website</option>
  <option>Business Website</option>
  <option>E-commerce Store</option>
  <option>Custom Project</option>
</select>

<textarea id="msg" placeholder="Tell us about your project..." required></textarea>

<button type="submit">Send Message</button>
</form>

<!-- SOCIAL ICONS -->
<div class="socials">
  <a href="https://facebook.com/YOURPAGE" target="_blank">
    <i class="fab fa-facebook-f"></i>
  </a>
  <a href="https://instagram.com/YOURPAGE" target="_blank">
    <i class="fab fa-instagram"></i>
  </a>
  <a href="https://wa.me/27602950755" target="_blank">
    <i class="fab fa-whatsapp"></i>
  </a>
</div>

<a class="whatsapp" href="https://wa.me/27602950755">
💬 Chat on WhatsApp
</a>

</div>

<script>
function sendMsg(e){
e.preventDefault();

let name=document.getElementById("name").value;
let email=document.getElementById("email").value;
let service=document.getElementById("service").value;
let msg=document.getElementById("msg").value;

let text = `Hi, I'm ${name}%0AEmail: ${email}%0AService: ${service}%0AMessage: ${msg}`;

window.open(`https://wa.me/27602950755?text=${text}`);
}
</script>

</body>
  </html>
