<!DOCTYPE html>
<html>
<head>
<title>Contact - PixelForge</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body{
  background:#070710;
  color:white;
  font-family:sans-serif;
}

.container{
  max-width:900px;
  margin:auto;
  padding:60px 20px;
  display:flex;
  flex-wrap:wrap;
  gap:40px;
}

/* LEFT SIDE */
.info{
  flex:1;
}

.info h1{margin-bottom:10px;}
.info p{color:#aaa;margin-bottom:20px;}

.info div{
  margin:10px 0;
}

/* RIGHT SIDE */
.form{
  flex:1;
}

form{
  display:flex;
  flex-direction:column;
  gap:10px;
}

input, textarea, select{
  padding:12px;
  border:none;
  border-radius:8px;
}

button{
  padding:12px;
  border:none;
  border-radius:8px;
  background:#7b2cff;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* SOCIALS */
.socials{
  margin-top:20px;
}

.socials a{
  margin-right:15px;
  font-size:20px;
  color:white;
}

/* WHATSAPP */
.whatsapp{
  display:inline-block;
  margin-top:20px;
  padding:12px 20px;
  background:#25D366;
  border-radius:8px;
  color:white;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<!-- LEFT -->
<div class="info">
<h1>Let’s Work Together 🚀</h1>
<p>Ready to grow your business with a professional website? Get in touch.</p>

<div>📧 pixelforgestudio@gmail.com</div>
<div>📞 060 295 0755</div>

<div class="socials">
<a href="https://facebook.com/YOURPAGE"><i class="fab fa-facebook"></i></a>
<a href="https://instagram.com/YOURPAGE"><i class="fab fa-instagram"></i></a>
<a href="https://wa.me/27602950755"><i class="fab fa-whatsapp"></i></a>
</div>

<a class="whatsapp" href="https://wa.me/27602950755">
💬 Chat on WhatsApp
</a>

</div>

<!-- RIGHT -->
<div class="form">
<form onsubmit="sendMsg(event)">

<input id="name" placeholder="Your Name" required>
<input id="email" type="email" placeholder="Your Email" required>

<select id="service">
<option>Starter Website</option>
<option>Business Website</option>
<option>E-commerce Store</option>
<option>Custom Project</option>
</select>

<textarea id="msg" placeholder="Tell us about your project..." required></textarea>

<button type="submit">Send Message</button>

</form>
</div>

</div>

<script>
function sendMsg(e){
e.preventDefault();

let name=document.getElementById("name").value;
let email=document.getElementById("email").value;
let service=document.getElementById("service").value;
let msg=document.getElementById("msg").value;

let text=`Hi, I'm ${name}%0AEmail: ${email}%0AService: ${service}%0AMessage: ${msg}`;

window.open(`https://wa.me/27602950755?text=${text}`);
}
</script>

</body>
</html>
