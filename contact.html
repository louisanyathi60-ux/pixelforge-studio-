<!DOCTYPE html>
<html>
<head>
<title>Contact</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body{background:#070710;color:white;text-align:center;}

.container{max-width:400px;margin:auto;padding:40px;}

input,textarea{
width:100%;padding:10px;margin:10px 0;border-radius:5px;border:none;
}

button{
padding:10px;background:#7b2cff;color:white;border:none;border-radius:5px;
}

.socials{
margin-top:20px;display:flex;justify-content:center;gap:15px;
}

.socials a{
color:white;font-size:20px;
}
</style>
</head>

<body>

<div class="container">

<h1>Contact</h1>

<form onsubmit="sendMsg(event)">
<input id="name" placeholder="Name" required>
<textarea id="msg" placeholder="Message" required></textarea>
<button>Send</button>
</form>

<div class="socials">
<a href="#"><i class="fab fa-facebook-f"></i></a>
<a href="#"><i class="fab fa-instagram"></i></a>
<a href="https://wa.me/27602950755"><i class="fab fa-whatsapp"></i></a>
</div>

</div>

<script>
function sendMsg(e){
e.preventDefault();
let name=document.getElementById("name").value;
let msg=document.getElementById("msg").value;
window.open(`https://wa.me/27602950755?text=Hi I'm ${name}. ${msg}`);
}
</script>

</body>
</html>
