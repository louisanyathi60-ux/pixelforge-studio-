<!DOCTYPE html>
<html>
<head>
<title>Contact</title>

<style>
body{background:#070710;color:white;font-family:sans-serif;text-align:center;}

form{
  max-width:400px;
  margin:auto;
  padding:40px;
}

input,textarea{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:none;
}

button{
  padding:12px;
  border:none;
  border-radius:8px;
  background:#7b2cff;
  color:white;
}
</style>
</head>

<body>

<h1>Contact</h1>

<form onsubmit="sendMsg(event)">
<input id="name" placeholder="Name" required>
<textarea id="msg" placeholder="Message" required></textarea>
<button>Send</button>
</form>

<p>📧 pixelforgestudio@gmail.com</p>
<p>📞 060 295 0755</p>

<script>
function sendMsg(e){
e.preventDefault();
let name=document.getElementById("name").value;
let msg=document.getElementById("msg").value;
window.open(`https://wa.me/27602950755?text=Hi, I'm ${name}. ${msg}`);
}
</script>

</body>
</html>
