<!DOCTYPE html>
<html>
<head>
<title>Pricing</title>

<style>
body{background:#070710;color:white;font-family:sans-serif;text-align:center;}

.cards{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:25px;
  padding:60px;
}

.card{
  padding:30px;
  background:#111122;
  border-radius:15px;
  width:260px;
}

.price{
  font-size:24px;
  color:#c084ff;
  margin:10px 0;
}

button{
  margin-top:15px;
  padding:10px 20px;
  border:none;
  background:#7b2cff;
  color:white;
  border-radius:5px;
}
</style>
</head>

<body>

<h1>Pricing</h1>

<div class="cards">

<div class="card">
<h3>Starter</h3>
<div class="price">R500</div>
<p>1 Page Website</p>
<p>Mobile Friendly</p>
<p>Fast Delivery</p>
<button>Choose Plan</button>
</div>

<div class="card">
<h3>Growth</h3>
<div class="price">R1500</div>
<p>Up to 4 Pages</p>
<p>Modern Design</p>
<p>SEO Setup</p>
<button>Most Popular</button>
</div>

<div class="card">
<h3>Pro</h3>
<div class="price">R3000+</div>
<p>Full Website</p>
<p>E-commerce</p>
<p>Custom Design</p>
<button>Get Started</button>
</div>

</div>

</body>
</html>
